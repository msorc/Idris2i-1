name: Idris2i-1

on:
  merge_group:
  push:
    branches:
      - '*'
    tags:
      - '*'
    paths-ignore:
      - 'docs/**'
      - 'icons/**'
      - 'Release/**'
      - '**.md'
      - 'CONTRIBUTORS'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.github/workflows/ci-bootstrap.yml'
      - '.github/workflows/ci-lint.yml'
      - '.github/workflows/ci-sphinx.yml'
      - '.github/workflows/ci-super-linter.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'icons/**'
      - 'Release/**'
      - '**.md'
      - 'CONTRIBUTORS'
      - 'LICENSE'
      - '.github/workflows/ci-bootstrap.yml'
      - '.github/workflows/ci-lint.yml'
      - '.github/workflows/ci-sphinx.yml'
      - '.github/workflows/ci-super-linter.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  initialise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          # for pull_request so we can do HEAD^2
          fetch-depth: 2

      - name: Get commit message
        id: get_commit_message
        run: |
          if   [[ '${{ github.event_name }}' == 'push' ]]; then
            echo "commit_message=$(git log --format=%B -n 1 HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          elif [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "commit_message=$(git log --format=%B -n 1 HEAD^2 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      commit_message:
        echo "${{ steps.get_commit_message.outputs.commit_message }}"

  ######################################################################
  # Bootstrapping builds
  ######################################################################

  # CHEZ

  ubuntu-bootstrap-chez:
    needs: initialise
    runs-on: ubuntu-latest
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci:')
      || contains(needs.initialise.outputs.commit_message, '[ci: ubuntu]')
      || contains(needs.initialise.outputs.commit_message, '[ci: chez]')
    env:
      IDRIS2I_1_CG: chez
      SCHEME: scheme
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Make bootstrap folder readonly
        run: chmod -R a-w bootstrap
      - name: Build from bootstrap
        run: make bootstrap && make install
      - name: Artifact Bootstrapped Idris2i-1
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ubuntu-installed-bootstrapped-idris2i-1-chez
          path: ~/.idris2i-1/

  macos-bootstrap-chez:
    needs: initialise
    runs-on: macos-latest
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci:')
      || contains(needs.initialise.outputs.commit_message, '[ci: macos]')
      || contains(needs.initialise.outputs.commit_message, '[ci: chez]')
    env:
      IDRIS2I_1_CG: chez
      SCHEME: chez
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          brew update
          brew install --overwrite python@3.12
          brew install node
          brew install chezscheme
          brew install coreutils
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Make bootstrap folder readonly
        run: chmod -R a-w bootstrap
      - name: Build Idris2i-1 from bootstrap
        run: make bootstrap && make install
        shell: bash
      - name: Artifact Bootstrapped Idris2i-1
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: macos-installed-bootstrapped-idris2i-1-chez
          path: ~/.idris2i-1/

  windows-bootstrap-chez:
    needs: initialise
    runs-on: windows-latest
    timeout-minutes: 45
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci:')
      || contains(needs.initialise.outputs.commit_message, '[ci: windows]')
      || contains(needs.initialise.outputs.commit_message, '[ci: chez]')
    # Pinned to Chez: the RefC layout (a launcher script next to
    # idris2i-1_app/idris2i-1, see the Makefile and bootstrap/idris2i-1-refc.sh) does
    # not know about Windows yet (idris2i-1.exe, no Windows branch in the
    # launcher, unlike bootstrap/idris2i-1-boot.sh).
    env:
      IDRIS2I_1_CG: chez
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
      SCHEME: scheme
      CC: gcc
    steps:
      - name: Init
        run: |
          git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get Chez Scheme
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme
          c:\msys64\usr\bin\bash -l -c "pacman -S --noconfirm tar make mingw-w64-x86_64-gcc"
          echo "PWD=$(c:\msys64\usr\bin\cygpath -u $(pwd))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure and Build Chez Scheme
        run: |
          c:\msys64\usr\bin\bash -l -c "cd $env:PWD && cd ChezScheme && ./configure --threads && make"
      - name: Set Path
        run: |
          $chez="$(pwd)\ChezScheme\ta6nt\bin\ta6nt"
          $idris="$(pwd)\.idris2i-1"
          echo "$chez" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$idris\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "IDRIS_PREFIX=$idris" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PREFIX=$(c:\msys64\usr\bin\cygpath -u $idris)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Scheme
        run: |
          scheme --version
      - name: Bootstrap
        run: c:\msys64\usr\bin\bash -l -c "cd $env:PWD && make bootstrap"
      - name: Bootstrap test
        run: c:\msys64\usr\bin\bash -l -c "cd $env:PWD && make ci-windows-bootstrap-test"
      - name: Install
        run: c:\msys64\usr\bin\bash -l -c "cd $env:PWD && make install"
      - name: Artifact Idris2i-1 from chez
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: windows-installed-bootstrapped-idris2i-1-chez
          path: ${{ env.IDRIS_PREFIX }}

  # The nix flake bootstraps a compiler with Chez (nix/package.nix with
  # idris2i_1Bootstrap = null), builds the default package with it, which uses
  # RefC like a plain `make`, and runs the tests with that one.
  nix-bootstrap-chez:
    needs: initialise
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      (!contains(needs.initialise.outputs.commit_message, '[ci:')
      || contains(needs.initialise.outputs.commit_message, '[ci: nix]')
      || contains(needs.initialise.outputs.commit_message, '[ci: chez]'))
    steps:
    - uses: actions/checkout@v7
      with:
          fetch-depth: 0
    - uses: cachix/install-nix-action@v31
    - name: Test with nix
      env:
        NIX_CONFIG: "experimental-features = nix-command flakes"
      run: nix build .#checks.x86_64-linux.idris2i_1Tests -L

  # C (RefC)

  ubuntu-bootstrap-c:
    needs: initialise
    runs-on: ubuntu-latest
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci:')
      || contains(needs.initialise.outputs.commit_message, '[ci: ubuntu]')
      || contains(needs.initialise.outputs.commit_message, '[ci: refc]')

    env:
      IDRIS2I_1_CG: refc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev xz-utils
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Check that no Scheme is available
        run: "! command -v chez && ! command -v scheme"
      - name: Make bootstrap folder readonly
        run: chmod -R a-w bootstrap
      - name: Build from bootstrap
        run: make bootstrap-c && make install
      - name: Test the RefC backend with the bootstrapped compiler
        run: make test only=refc INTERACTIVE=''
      - name: Artifact Bootstrapped Idris2i-1
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ubuntu-installed-bootstrapped-idris2i-1-refc
          path: ~/.idris2i-1/

  # The bootstrap from C on macOS, with the defaults of the Makefile (RefC),
  # and the whole test suite.  GMP comes from Homebrew, whose include and lib
  # directories are not searched by default: CPPFLAGS and LDFLAGS name them
  # (config.mk adds them as well from HOMEBREW_PREFIX), and the compiler
  # passes them on when it compiles C.

  macos-bootstrap-c:
    needs: initialise
    runs-on: macos-latest
    timeout-minutes: 90
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci:')
      || contains(needs.initialise.outputs.commit_message, '[ci: macos]')
      || contains(needs.initialise.outputs.commit_message, '[ci: refc]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          brew install gmp xz coreutils
          BREW_PREFIX="$(brew --prefix)"
          {
            echo "HOMEBREW_PREFIX=$BREW_PREFIX"
            echo "CPPFLAGS=-I$BREW_PREFIX/include"
            echo "LDFLAGS=-L$BREW_PREFIX/lib"
          } >> "$GITHUB_ENV"
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Make bootstrap folder readonly
        run: chmod -R a-w bootstrap
      - name: Build Idris2i-1 from bootstrap
        run: make bootstrap-c && make install
        shell: bash
      - name: Test
        run: make ci-macos-test INTERACTIVE=''
        shell: bash

  ######################################################################
  # Self-hosting builds and testing
  ######################################################################

  # CHEZ

  ubuntu-self-host-chez:
    needs: ubuntu-bootstrap-chez
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IDRIS2I_1_CG: chez
      SCHEME: scheme
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Idris2i-1 Artifact
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-installed-bootstrapped-idris2i-1-chez
          path: ~/.idris2i-1/
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.idris2i-1/bin/idris2i-1" "$HOME/.idris2i-1/bin/idris2i-1_app/"*
      - name: Build self-hosted
        run: make all IDRIS2I_1_BOOT="idris2i-1 -Werror" && make install
      - name: Test self-hosted
        run: make ci-ubuntu-test INTERACTIVE=''

  macos-self-host-chez:
    needs: macos-bootstrap-chez
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      IDRIS2I_1_CG: chez
      SCHEME: chez
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Idris2i-1 Artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-installed-bootstrapped-idris2i-1-chez
          path: ~/.idris2i-1/
      - name: Install build dependencies
        run: |
          brew update
          brew install --overwrite python@3.12
          brew install chezscheme
          brew install node
          brew install coreutils
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.idris2i-1/bin/idris2i-1" "$HOME/.idris2i-1/bin/idris2i-1_app/"*
      - name: Build self-hosted
        run: make all IDRIS2I_1_BOOT="idris2i-1 -Werror" && make install
        shell: bash
      - name: Test self-hosted
        run: make ci-macos-test INTERACTIVE=''
        shell: bash

  # C (RefC)
  #
  # The build of a user: no IDRIS2I_1_CG, so the defaults of the Makefile and of
  # the compiler (RefC), with the compiler that was bootstrapped from C.  Chez
  # is installed so that the tests of the Chez backend run too.

  ubuntu-self-host-refc:
    needs: ubuntu-bootstrap-c
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Idris2i-1 Artifact
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-installed-bootstrapped-idris2i-1-refc
          path: ~/.idris2i-1/
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev chezscheme
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.idris2i-1/bin/idris2i-1" "$HOME/.idris2i-1/bin/idris2i-1_app/"*
      - name: Build self-hosted
        run: make all IDRIS2I_1_BOOT="idris2i-1 -Werror" && make install
      - name: Test self-hosted
        run: make ci-ubuntu-test INTERACTIVE=''

  ######################################################################
  # Ubuntu API
  ######################################################################

  ubuntu-build-api:
    needs: ubuntu-bootstrap-chez
    runs-on: ubuntu-latest
    env:
      IDRIS2I_1_CG: chez
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Idris2i-1 Artifact
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-installed-bootstrapped-idris2i-1-chez
          path: ~/.idris2i-1/
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.idris2i-1/bin/idris2i-1" "$HOME/.idris2i-1/bin/idris2i-1_app/"*
      - name: Build API
        run: make install-api
        shell: bash
      - name: Test API 001
        run: cd tests/idris2i-1/api/api001 && ./run "$HOME/.idris2i-1/bin/idris2i-1"
        shell: bash
      - name: Test API 002
        run: cd tests/idris2i-1/api/api002 && ./run "$HOME/.idris2i-1/bin/idris2i-1"
        shell: bash

  overall-success:
    needs:
      [ macos-self-host-chez
      , macos-bootstrap-c
      , ubuntu-bootstrap-c
      , ubuntu-self-host-refc
      , nix-bootstrap-chez
      , ubuntu-self-host-chez
      , ubuntu-build-api
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Success!
        run: true