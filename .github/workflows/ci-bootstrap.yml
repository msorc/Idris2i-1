######################################################################
# Unlike the main yml file this uses the LTS version of the tools
# (chezscheme, racket, gcc) of an older LTS runner, not the newest one.
# The main purpose is to make sure that the bootstraps do not rely on
# something that only newer tools have: `make bootstrap` must not rely
# on `__collect_safe` (Chez Scheme), and `make bootstrap-c` must work
# with the C compiler of a long term support distribution.
#
# It runs when one of the inputs of the bootstraps changes: the
# generated code (bootstrap/idris2i-1_app/idris2i-1.ss, idris2i-1.rkt and
# idris2i-1.c.xz), the scripts that build from it and the rest of bootstrap/,
# the support libraries (the checked-in C is compiled against the headers
# of support/refc and support/c as they are now, and every bootstrap links
# libidris2i_1_support), and the Makefile and config.mk that drive them.
#
# Note that we are *not* running on ubuntu-latest so this needs manual
# upgrades if we want to jump on a newer github actions environment.
######################################################################

name: Bootstrap

on:
  push:
    paths:
      - 'bootstrap/**'
      - 'bootstrap*.sh'
      - 'support/**'
      - 'Makefile'
      - 'config.mk'
      - '.github/workflows/ci-bootstrap.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'bootstrap*.sh'
      - 'support/**'
      - 'Makefile'
      - 'config.mk'
      - '.github/workflows/ci-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:

  initialise:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          # for pull_request so we can do HEAD^2
          fetch-depth: 2

      - name: Get commit message
        id: get_commit_message
        run: |
          if   [[ '${{ github.event_name }}' == 'push' ]]; then
            echo "commit_message=$(git log --format=%B -n 1 HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          elif [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "commit_message=$(git log --format=%B -n 1 HEAD^2 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      commit_message:
        echo "${{ steps.get_commit_message.outputs.commit_message }}"

  # Chez Scheme: bootstrap/idris2i-1_app/idris2i-1.ss

  bootstrap-chez:
    needs: initialise
    runs-on: ubuntu-22.04
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci: skip]')
    env:
      IDRIS2I_1_CG: chez
      SCHEME: scheme
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies (LTS versions)
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Build bootstrap
        run: make bootstrap

  # Racket: bootstrap/idris2i-1_app/idris2i-1.rkt

  bootstrap-racket:
    needs: initialise
    runs-on: ubuntu-22.04
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci: skip]')
    env:
      IDRIS2I_1_CG: racket
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies (LTS versions)
        run: |
          sudo apt-get update
          sudo apt-get install -y racket
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Build bootstrap
        run: make bootstrap-racket

  # C (RefC): bootstrap/idris2i-1_app/idris2i-1.c.xz.  The main yml file also
  # tests the compiler that this builds, here it is only built.

  bootstrap-c:
    needs: initialise
    runs-on: ubuntu-22.04
    if: |
      !contains(needs.initialise.outputs.commit_message, '[ci: skip]')
    env:
      IDRIS2I_1_CG: refc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies (LTS versions)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev xz-utils
          echo "$HOME/.idris2i-1/bin" >> "$GITHUB_PATH"
      - name: Check that no Scheme is available
        run: "! command -v chez && ! command -v scheme && ! command -v racket"
      - name: Build bootstrap
        run: make bootstrap-c
